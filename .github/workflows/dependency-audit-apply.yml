# Reuse the App already used by the porting workflows for automatic draft PRs.
# Omit both app_id and the App secret mapping to publish a validated branch
# and an Open a PR link instead.
# Applying requires DEPENDENCY_AUDIT_ENABLE_APPLY=true.

name: Apply one dependency audit area

on:
  workflow_dispatch:
    inputs:
      area:
        description: "Stable area slug from the current modernization tracker"
        required: true
        type: string
      issue:
        description: "Current tracker issue number, or 0 to find it automatically"
        default: 0
        type: number
      replace_pr:
        description: "Closed, unmerged migration PR to explicitly replace, or 0"
        default: 0
        type: number

permissions:
  contents: read

jobs:
  apply:
    uses: microsoft/go-infra/.github/workflows/dependency-audit-apply.yml@a7b202f05a5282deb46d3b6c342a2da8e07244f2
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      copilot-requests: write
    secrets:
      DEPENDENCY_AUDIT_APP_PRIVATE_KEY: ${{ secrets.GHMANAGER_GITHUBAPP_MICROSOFT_AGENT_FRAMEWORK_FOR_GO_PRIVATE_KEY_PEM }}
    with:
      app_id: Iv23liUO5H4lTSrArWgE
      target_repo: ${{ github.repository }}
      area: ${{ inputs.area }}
      issue: ${{ inputs.issue }}
      replace_pr: ${{ inputs.replace_pr }}

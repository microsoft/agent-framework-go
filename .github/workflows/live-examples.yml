name: Live Copilot example

on:
  schedule:
    - cron: "17 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: live-copilot-example
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Copilot example
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install Copilot CLI
        shell: bash
        run: npm install --global @github/copilot@1.0.75

      - name: Run live example
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          go run ./cmd/verifyexamples \
            02_agents_providers_github_copilot_function_tool \
            --parallel 1 \
            --log live-copilot-example.log \
            --md live-copilot-example.md
          status=$?
          set -e

          if [[ -f live-copilot-example.md ]]; then
            cat live-copilot-example.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The example verifier exited before it could write a report." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-copilot-example-results
          path: |
            live-copilot-example.log
            live-copilot-example.md
          if-no-files-found: warn
          retention-days: 14
name: Live examples

on:
  schedule:
    - cron: "17 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: live-examples
  cancel-in-progress: false

jobs:
  verify:
    name: Verify examples
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Copilot CLI
        shell: bash
        run: npm install --prefix .github/copilot --no-package-lock

      - name: Verify examples
        id: examples
        continue-on-error: true
        shell: bash
        env:
          COPILOT_CLI_PATH: ${{ github.workspace }}/.github/copilot/node_modules/.bin/copilot
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          go run ./cmd/verifyexamples \
            --parallel 4 \
            --log live-examples.log \
            --md live-examples.md
          status=$?
          set -e

          if [[ -f live-examples.md ]]; then
            cat live-examples.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The example verifier exited before it could write a report." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-example-results
          path: |
            live-examples.log
            live-examples.md
          if-no-files-found: warn
          retention-days: 14

      - name: Check results
        if: always()
        shell: bash
        env:
          EXAMPLES_OUTCOME: ${{ steps.examples.outcome }}
        run: |
          if [[ "$EXAMPLES_OUTCOME" != "success" ]]; then
            echo "Example verification failed."
            exit 1
          fi

# Read PR metadata and trusted configuration through the API without checking
# out or executing contributor code.
#
# The label configuration defined in .github/labeler.yml.

name: Classify pull requests
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

jobs:
  label-areas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Sync area labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true

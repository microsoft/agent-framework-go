# Audits use this repository's GITHUB_TOKEN, with no App credentials.
# Run manually with initial_sha first.
# Do not also enroll this repository in go-infra's central schedule.

name: Dependency history audit

on:
  # TEMP: remove the label-only PR trigger after the audit test.
  pull_request:
    types: [labeled]
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      initial_sha:
        description: "Exclusive starting commit for the first audit, as a full SHA"
        default: ""
        type: string

permissions:
  contents: read

jobs:
  audit:
    # TEMP: permit only the explicit audit test on this same-repository PR.
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.repository == 'microsoft/agent-framework-go' &&
        github.event.repository.fork == false &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'dependency-audit-smoke' &&
        github.event.pull_request.number == 1323 &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'dev/mclayton/dependency-audit-consumer' &&
        github.event.pull_request.base.ref == github.event.repository.default_branch
      )
    uses: microsoft/go-infra/.github/workflows/dependency-audit-target.yml@1f272d3944773d356c42a1f3d98e92f148538b19
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
      copilot-requests: write
    with:
      target_repo: ${{ github.repository }}
      # TEMP: clear this variable after the first successful audit so later runs resume its checkpoint.
      initial_sha: ${{ github.event_name == 'pull_request' && vars.DEPENDENCY_AUDIT_TEST_INITIAL_SHA || inputs.initial_sha || '' }}

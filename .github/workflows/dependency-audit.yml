# Audits use this repository's GITHUB_TOKEN, with no App credentials.
# Run manually with initial_sha first.
# Do not also enroll this repository in go-infra's central schedule.

name: Dependency history audit

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      initial_sha:
        description: "Exclusive starting commit for the first audit, as a full SHA"
        default: ""
        type: string

permissions:
  contents: read

jobs:
  audit:
    uses: microsoft/go-infra/.github/workflows/dependency-audit-target.yml@4f97a1a02d432437bf178c88c286f3011a3fa87d
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
      copilot-requests: write
    with:
      target_repo: ${{ github.repository }}
      initial_sha: ${{ inputs.initial_sha || '' }}

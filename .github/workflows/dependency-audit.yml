# Run manually with initial_sha first.

name: Dependency history audit

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      initial_sha:
        description: "Exclusive starting commit for the first audit, as a full SHA"
        default: ""
        type: string

permissions:
  contents: read

jobs:
  audit:
    uses: microsoft/go-infra/.github/workflows/dependency-audit-target.yml@a70f3dfc02f3cedeed667d8347dc1817c6d32d04
    permissions:
      actions: write
      contents: read
      issues: write
      copilot-requests: write
    with:
      initial_sha: ${{ inputs.initial_sha || '' }}

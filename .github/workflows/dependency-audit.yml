# Run manually with initial_sha first.

name: Dependency history audit

on:
  # TEMP: remove the label-only PR trigger after the audit test.
  pull_request:
    types: [labeled]
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      initial_sha:
        description: "Exclusive starting commit for the first audit, as a full SHA"
        default: ""
        type: string

permissions:
  contents: read

jobs:
  audit:
    # TEMP: permit only the explicit audit test on this same-repository PR.
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.repository == 'microsoft/agent-framework-go' &&
        github.event.repository.fork == false &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'dependency-audit-smoke' &&
        github.event.pull_request.number == 1323 &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'dev/mclayton/dependency-audit-consumer' &&
        github.event.pull_request.base.ref == github.event.repository.default_branch
      )
    uses: microsoft/go-infra/.github/workflows/dependency-audit-target.yml@98cf75fb5cc8fcfa92c7e9ff49d39ddea135215c
    permissions:
      actions: write
      contents: read
      issues: write
      copilot-requests: write
    with:
      initial_sha: ${{ inputs.initial_sha || '' }}

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
    types: [checks_requested]

jobs:
  test:
    name: Test Go Code (${{ matrix.target.name }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.target.runner }}
    
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26', '1.27']
        target:
        - name: linux
          runner: ubuntu-latest
        - name: windows
          runner: windows-latest
        - name: windows-arm64
          runner: windows-11-arm
        - name: macos
          runner: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ matrix.go-version }}
        cache-dependency-path: go.sum
    
    - name: Run tests
      run: go test -v ${{ matrix.target.name != 'windows-arm64' && '-race' || '' }} -shuffle=on ./...

  copilot-integration:
    name: GitHub Copilot integration
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Copilot CLI
        shell: bash
        run: npm install --prefix .github/copilot --no-package-lock

      - name: Run Copilot integration tests
        env:
          COPILOT_CLI_PATH: ${{ github.workspace }}/.github/copilot/node_modules/.bin/copilot
          GITHUB_TOKEN: ${{ github.token }}
        run: go test -count=1 -v ./provider/copilotprovider -run '^TestE2E_'

  conclusion:
    needs: [test, copilot-integration]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Result
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled."
            exit 1
          fi
          echo "All jobs passed."
